<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 68" width="280" height="68" fill="none">
  <!-- Architectural Geometric Monogram -->
  <g transform="translate(6, 8)">
    <!-- Outer framing square -->
    <rect x="0.5" y="0.5" width="51" height="51" rx="1.5" stroke="#C5A059" stroke-width="1.5" stroke-opacity="0.9"/>
    <!-- Inner dashed architectural grid -->
    <rect x="6.5" y="6.5" width="39" height="39" stroke="#C5A059" stroke-width="0.8" stroke-opacity="0.45" stroke-dasharray="2.5 2.5"/>
    
    <!-- Bold structural lettermark 'N' -->
    <path d="M15 39 V13 L37 39 V13" stroke="#1C1917" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter"/>
    
    <!-- Architectural vertex pins -->
    <circle cx="37" cy="13" r="2.2" fill="#C5A059"/>
    <circle cx="15" cy="39" r="2.2" fill="#C5A059"/>
  </g>

  <!-- Typography -->
  <g transform="translate(70, 0)">
    <text x="0" y="34" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="28" font-weight="600" letter-spacing="0.03em" fill="#1C1917">naz by nazish</text>
    <!-- Architectural baseline divider -->
    <line x1="0" y1="41" x2="198" y2="41" stroke="#C5A059" stroke-width="0.9" stroke-opacity="0.75"/>
    <!-- Subtitle -->
    <text x="1" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.22em" fill="#9A7B39">ARCHITECTURE &bull; SPATIAL DESIGN</text>
  </g>
</svg>
